<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Món Quà Nhỏ Gửi Mẹ Yêu - 20/10</title>

  <!-- Google Fonts hỗ trợ tiếng Việt đầy đủ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #fdf8f2;
      --bg-pink: #f9e5e8;
      --bg-gold: #f7ead2;
      --warm-sun-1: #fff6e8;
      --warm-sun-2: #fce4dc;
      --warm-sun-3: #f5d0c5;
      --paper-ivory: #fffdf9;
      --paper-edge: #f4ece1;
      --gold-accent: #c59b5f;
      --gold-light: #e5c99b;
      --rose-deep: #b84a59;
      --rose-soft: #d97b88;
      --ink-main: #3d2c28;
      --ink-Warm: #5c3d36;
      --ink-title: #8d3b47;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Lora', serif;
      color: var(--ink-main);
      background-color: var(--bg-cream);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ẩn hoàn toàn thẻ audio để không hiện bất kỳ thanh điều khiển nào */
    #bg-audio {
      display: none;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    /* ==================== NỀN CHUYỂN CẢNH ==================== */
    .scene-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-intro {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 250, 240, 0.95) 0%, rgba(252, 228, 232, 0.75) 45%, rgba(246, 224, 205, 0.9) 100%),
        linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-pink) 55%, var(--bg-gold) 100%);
      transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bg-warm {
      position: absolute;
      inset: 0;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 245, 214, 0.95) 0%, rgba(253, 234, 222, 0.85) 42%, rgba(244, 211, 198, 0.92) 100%),
        linear-gradient(165deg, #fff8eb 0%, #fbe3da 50%, #f3d5c3 100%);
      transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.warm-scene .bg-warm {
      opacity: 1;
    }

    /* Hiệu ứng tia nắng ấm áp */
    .sunlight-rays {
      position: absolute;
      top: -25%;
      left: -20%;
      width: 140%;
      height: 95%;
      opacity: 0;
      background:
        conic-gradient(
          from 145deg at 50% 0%,
          transparent 0deg,
          rgba(255, 243, 207, 0.42) 15deg,
          transparent 32deg,
          rgba(255, 238, 195, 0.35) 48deg,
          transparent 65deg,
          rgba(255, 245, 215, 0.45) 82deg,
          transparent 105deg
        );
      filter: blur(28px);
      transform-origin: 50% 0%;
      animation: sunSway 14s ease-in-out infinite alternate;
      transition: opacity 2.8s ease;
    }

    body.warm-scene .sunlight-rays {
      opacity: 1;
    }

    @keyframes sunSway {
      0% { transform: rotate(-4deg) scale(1); }
      100% { transform: rotate(4deg) scale(1.06); }
    }

    /* Canvas cho hiệu ứng đốm sáng và cánh hoa */
    #effect-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* ==================== MÀN HÌNH 1: TRÁI TIM 3D ==================== */
    #intro-stage {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      perspective: 1200px;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #intro-stage.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heart-interactive-zone {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform-style: preserve-3d;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Vầng sáng phía sau trái tim */
    .heart-aura {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 165, 178, 0.55) 0%, rgba(245, 206, 152, 0.3) 45%, transparent 72%);
      filter: blur(12px);
      animation: auraBreathe 3.6s ease-in-out infinite;
      pointer-events: none;
    }

    .heart-ring {
      position: absolute;
      width: 165px;
      height: 165px;
      border-radius: 50%;
      border: 1px solid rgba(212, 165, 116, 0.35);
      box-shadow: 0 0 25px rgba(235, 160, 175, 0.25);
      animation: ringPulse 3.6s ease-out infinite;
      pointer-events: none;
    }

    @keyframes auraBreathe {
      0%, 100% { transform: scale(0.94); opacity: 0.75; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    @keyframes ringPulse {
      0% { transform: scale(0.82); opacity: 0.75; }
      75% { transform: scale(1.28); opacity: 0; }
      100% { transform: scale(1.28); opacity: 0; }
    }

    /* Khối trái tim 3D */
    .heart-3d-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      transform-style: preserve-3d;
      animation: heartFloat3D 4.2s ease-in-out infinite;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease;
      filter: drop-shadow(0 18px 28px rgba(176, 65, 82, 0.28));
    }

    .heart-interactive-zone:hover .heart-3d-wrap {
      transform: scale(1.06) translateY(-4px);
      filter: drop-shadow(0 22px 34px rgba(186, 68, 86, 0.38));
    }

    .heart-interactive-zone:active .heart-3d-wrap {
      transform: scale(0.96);
    }

    /* Các lớp chiều sâu 3D của trái tim */
    .heart-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .heart-layer.back-2 {
      transform: translateZ(-10px) scale(0.96);
      opacity: 0.45;
      filter: blur(2px);
    }

    .heart-layer.back-1 {
      transform: translateZ(-5px) scale(0.98);
      opacity: 0.75;
    }

    .heart-layer.main {
      transform: translateZ(0px);
    }

    .heart-layer.shine {
      transform: translateZ(8px);
      pointer-events: none;
    }

    @keyframes heartFloat3D {
      0%, 100% {
        transform: translateY(0px) rotateY(-11deg) rotateX(6deg) scale(1);
      }
      25% {
        transform: translateY(-7px) rotateY(0deg) rotateX(9deg) scale(1.035);
      }
      50% {
        transform: translateY(-11px) rotateY(11deg) rotateX(6deg) scale(1.01);
      }
      75% {
        transform: translateY(-5px) rotateY(2deg) rotateX(3deg) scale(1.04);
      }
    }

    /* Trạng thái trái tim phát sáng & rung lên đầy cảm xúc khi chạm */
    .heart-interactive-zone.activating .heart-aura {
      animation: none;
      transform: scale(1.65);
      opacity: 1;
      background: radial-gradient(circle, rgba(255, 235, 195, 0.95) 0%, rgba(242, 138, 156, 0.75) 45%, transparent 75%);
      transition: all 0.85s ease;
    }

    .heart-interactive-zone.activating .heart-3d-wrap {
      animation: emotionalTremble 0.95s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    @keyframes emotionalTremble {
      0% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 200, 175, 0.6)) brightness(1.05); }
      15% { transform: scale(1.12) rotate(-4deg); }
      30% { transform: scale(1.16) rotate(4deg); filter: drop-shadow(0 0 38px rgba(255, 215, 150, 0.95)) brightness(1.22); }
      45% { transform: scale(1.13) rotate(-3deg); }
      60% { transform: scale(1.22) rotate(3deg); }
      75% { transform: scale(1.26) rotate(-2deg); filter: drop-shadow(0 0 55px rgba(255, 240, 200, 1)) brightness(1.4); }
      90% { transform: scale(1.32); opacity: 0.9; }
      100% { transform: scale(0.2); opacity: 0; }
    }

    /* Lời dẫn bên dưới trái tim */
    .intro-caption {
      margin-top: 26px;
      text-align: center;
      max-width: 440px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #intro-stage.fading-text .intro-caption {
      opacity: 0;
      transform: translateY(12px);
    }

    .intro-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.45rem, 4.6vw, 1.95rem);
      font-weight: 600;
      font-style: italic;
      color: var(--ink-title);
      letter-spacing: 0.01em;
      line-height: 1.4;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
    }

    .intro-hint {
      font-family: 'Lora', serif;
      font-size: clamp(0.9rem, 3.2vw, 1.02rem);
      color: var(--ink-Warm);
      opacity: 0.85;
      letter-spacing: 0.02em;
      line-height: 1.5;
      animation: gentleHintPulse 2.8s ease-in-out infinite;
    }

    @keyframes gentleHintPulse {
      0%, 100% { opacity: 0.65; transform: translateY(0); }
      50% { opacity: 0.98; transform: translateY(-2px); }
    }

    /* ==================== MÀN HÌNH 2: PHONG THƯ 3D ==================== */
    #envelope-stage {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      perspective: 1400px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    #envelope-stage.active {
      opacity: 1;
      visibility: visible;
    }

    #envelope-stage.fade-away {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }

    .envelope-3d-wrapper {
      position: relative;
      width: min(320px, 84vw);
      height: min(215px, 56vw);
      transform-style: preserve-3d;
      transform: scale(0.65) translateY(35px) rotateX(14deg);
      transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #envelope-stage.active .envelope-3d-wrapper {
      transform: scale(1) translateY(15px) rotateX(6deg);
    }

    #envelope-stage.fade-away .envelope-3d-wrapper {
      transform: scale(1.08) translateY(65px) rotateX(12deg);
    }

    /* Mặt lưng phong bì */
    .env-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #f8efe2 0%, #eddcc4 100%);
      border-radius: 8px;
      border: 1px solid rgba(197, 155, 95, 0.45);
      box-shadow:
        0 24px 50px rgba(120, 68, 55, 0.22),
        0 6px 16px rgba(120, 68, 55, 0.12),
        inset 0 0 24px rgba(197, 155, 95, 0.15);
    }

    /* Tờ thư trượt lên từ bên trong phong bì */
    .env-letter-preview {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 8%;
      height: 86%;
      background: linear-gradient(180deg, #fffdf9 0%, #faf3e8 100%);
      border-radius: 6px;
      border: 1px solid rgba(197, 155, 95, 0.4);
      box-shadow: 0 4px 16px rgba(95, 55, 45, 0.12);
      padding: 16px 18px;
      transform: translateY(0) translateZ(2px);
      transition: transform 1.15s cubic-bezier(0.25, 1, 0.38, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }

    .env-letter-preview::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(197, 155, 95, 0.35);
      border-radius: 3px;
      pointer-events: none;
    }

    .preview-crest {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem;
      color: var(--ink-title);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 6px;
      margin-bottom: 10px;
      opacity: 0.85;
    }

    .preview-lines {
      width: 78%;
      display: flex;
      flex-direction: column;
      gap: 7px;
      opacity: 0.45;
    }

    .preview-lines span {
      display: block;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
    }

    .envelope-3d-wrapper.slide-letter .env-letter-preview {
      transform: translateY(-68%) translateZ(4px) scale(1.03);
    }

    /* Túi trước phong bì */
    .env-front-pocket {
      position: absolute;
      inset: 0;
      z-index: 3;
      transform: translateZ(6px);
      pointer-events: none;
    }

    .env-front-pocket svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
    }

    /* Nắp phong bì mở 3D */
    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 58%;
      z-index: 4;
      transform-origin: top center;
      transform-style: preserve-3d;
      transform: rotateX(0deg) translateZ(7px);
      transition: transform 0.95s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.45s;
    }

    .envelope-3d-wrapper.open-flap .env-flap {
      transform: rotateX(180deg) translateZ(1px);
      z-index: 1;
    }

    .env-flap svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 5px 8px rgba(110, 65, 50, 0.14));
    }

    /* Con dấu sáp hoa hồng sang trọng trên phong bì */
    .wax-seal {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 46px;
      height: 46px;
      transform: translate(-50%, -50%) translateZ(9px);
      z-index: 5;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d86c7a 0%, #a93847 65%, #7c222e 100%);
      box-shadow:
        0 4px 10px rgba(92, 28, 36, 0.35),
        inset 0 2px 4px rgba(255, 215, 215, 0.45),
        inset 0 -2px 5px rgba(60, 12, 18, 0.5);
      border: 1.5px solid rgba(232, 192, 135, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .envelope-3d-wrapper.open-flap .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.25);
    }

    /* ==================== MÀN HÌNH 3: LÁ THƯ MỞ RA ==================== */
    #letter-stage {
      position: fixed;
      inset: 0;
      z-index: 8;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: clamp(20px, 5vw, 48px) clamp(14px, 4vw, 28px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      perspective: 1500px;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    #letter-stage.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Tờ giấy thư với hiệu ứng mở 3D tự nhiên */
    .letter-paper {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: auto 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 252, 245, 0.95) 0%, rgba(255, 252, 246, 0.98) 60%, rgba(249, 241, 229, 1) 100%);
      background-color: var(--paper-ivory);
      border-radius: 12px;
      padding: clamp(28px, 6.5vw, 56px) clamp(22px, 6vw, 54px);
      box-shadow:
        0 26px 65px rgba(112, 62, 50, 0.18),
        0 6px 20px rgba(112, 62, 50, 0.09),
        inset 0 0 45px rgba(218, 186, 142, 0.16);
      border: 1px solid rgba(197, 155, 95, 0.35);
      transform-origin: center top;
      transform: translateY(36px) rotateX(-22deg) scale(0.92);
      opacity: 0;
      transition:
        transform 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.9s ease;
    }

    #letter-stage.unfolded .letter-paper {
      transform: translateY(0) rotateX(0deg) scale(1);
      opacity: 1;
    }

    /* Nếp gấp giấy nhẹ tạo cảm giác thư thật */
    .paper-crease {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 5%, rgba(197, 155, 95, 0.16) 50%, transparent 95%);
      pointer-events: none;
    }

    .paper-crease.crease-1 { top: 33%; }
    .paper-crease.crease-2 { top: 66%; }

    /* Viền trang trí mảnh bên trong tờ giấy */
    .paper-inner-border {
      position: absolute;
      inset: clamp(10px, 2.2vw, 16px);
      border: 1px solid rgba(197, 155, 95, 0.38);
      border-radius: 8px;
      pointer-events: none;
    }

    .paper-inner-border::after {
      content: "";
      position: absolute;
      inset: 4px;
      border: 0.5px solid rgba(197, 155, 95, 0.22);
      border-radius: 6px;
    }

    /* Họa tiết hoa vẽ nét mảnh ở 4 góc giấy */
    .corner-floral {
      position: absolute;
      width: clamp(54px, 12vw, 78px);
      height: clamp(54px, 12vw, 78px);
      pointer-events: none;
      opacity: 0.72;
      z-index: 1;
    }

    .corner-floral.tl { top: 14px; left: 14px; }
    .corner-floral.tr { top: 14px; right: 14px; transform: scaleX(-1); }
    .corner-floral.bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
    .corner-floral.br { bottom: 14px; right: 14px; transform: scale(-1, -1); }

    /* Nội dung bức thư */
    .letter-content-wrap {
      position: relative;
      z-index: 2;
    }

    /* Phần tiêu đề 20/10 */
    .letter-header {
      text-align: center;
      margin-bottom: clamp(22px, 4.5vw, 32px);
      padding: 0 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .letter-header.show {
      opacity: 1;
      transform: translateY(0);
    }

    .header-ornament-top {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .letter-main-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.35rem, 4.5vw, 1.85rem);
      font-weight: 700;
      color: var(--ink-title);
      letter-spacing: 0.02em;
      line-height: 1.35;
    }

    .header-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .header-divider .line {
      width: clamp(45px, 14vw, 85px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
    }

    /* Lời chào đầu thư viết tay */
    .letter-greeting {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.65rem, 5.2vw, 2.15rem);
      font-weight: 700;
      color: var(--ink-title);
      margin-bottom: 18px;
      line-height: 1.4;
      min-height: 1.4em;
    }

    /* Nội dung các đoạn văn trong thư */
    .letter-body {
      font-family: 'Lora', serif;
      font-size: clamp(0.98rem, 3.3vw, 1.08rem);
      line-height: 1.88;
      color: var(--ink-main);
      text-align: left;
    }

    .letter-paragraph {
      margin-bottom: 16px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.4s ease, max-height 0.6s ease;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .letter-paragraph.active-para {
      opacity: 1;
      max-height: 800px;
      overflow: visible;
    }

    .letter-paragraph.highlight-wish {
      font-weight: 500;
      color: var(--ink-title);
    }

    .letter-paragraph.love-closing {
      font-style: italic;
      font-weight: 500;
      color: var(--ink-Warm);
      margin-top: 18px;
    }

    /* Hiệu ứng từng chữ xuất hiện mượt mà không nhảy dòng */
    .word-unit {
      display: inline;
    }

    .char-unit {
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .char-unit.revealed {
      opacity: 1;
    }

    /* Khu vực chữ ký cuối thư */
    .letter-signature-block {
      margin-top: 26px;
      padding-right: clamp(6px, 2vw, 18px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.1s ease, transform 1.1s ease;
    }

    .letter-signature-block.show {
      opacity: 1;
      transform: translateY(0);
    }

    .signature-handwriting {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.75rem, 5.5vw, 2.25rem);
      font-weight: 700;
      color: var(--ink-title);
      line-height: 1.4;
      position: relative;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 2.2s cubic-bezier(0.35, 0, 0.25, 1);
    }

    .letter-signature-block.show .signature-handwriting {
      clip-path: inset(0 0% 0 0);
    }

    .signature-flourish {
      margin-top: 4px;
      width: 135px;
      height: 18px;
      opacity: 0.75;
    }

    .signature-flourish path {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      transition: stroke-dashoffset 1.8s ease 0.8s;
    }

    .letter-signature-block.show .signature-flourish path {
      stroke-dashoffset: 0;
    }

    /* Thao tác nhỏ tinh tế ở cuối trang để xem lại từ đầu */
    .replay-area {
      margin-top: 28px;
      padding-top: 14px;
      text-align: center;
      border-top: 1px dashed rgba(197, 155, 95, 0.28);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s ease;
    }

      opacity: 1;
      visibility: visible;
    }

    .replay-link {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.98rem;
      color: var(--ink-Warm);

      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.3s ease, color 0.3s ease, transform 0.3s ease;
    }

    .replay-link:hover, .replay-link:active {
      opacity: 1;
      color: var(--ink-title);
      transform: translateY(-1px);
    }

    /* Tối ưu cho màn hình nhỏ */

  <script>
    (function () {

        {
          text: 'Con sẽ cố gắng học tập thật tốt, trưởng thành hơn từng ngày để mẹ có thể yên tâm và tự hào về con. Con không hứa sẽ luôn hoàn hảo, nhưng con hứa sẽ cố gắng nhiều hơn để không phụ lòng mẹ.',
          className: ''
        },
        {
          text: 'Chúc mẹ một ngày 20/10 thật hạnh phúc!',
          className: 'highlight-wish'
        },
        {
          text: 'Mong mọi điều tốt đẹp nhất sẽ đến với mẹ, mong những vất vả của mẹ được đền đáp bằng thật nhiều niềm vui, và mong mẹ luôn khỏe mạnh để ở bên con thật lâu.',
          className: ''
        },
        {
          text: 'Con yêu mẹ nhiều lắm!',
          className: 'love-closing'
        }
      ];

      /* ==================== TRẠNG THÁI CHƯƠNG TRÌNH ==================== */
      const introStage = document.getElementById('intro-stage');
      const heartTrigger = document.getElementById('heart-trigger');
      const envelopeStage = document.getElementById('envelope-stage');
      const envelope3D = document.getElementById('envelope-3d');
      const letterStage = document.getElementById('letter-stage');
      const letterHeader = document.getElementById('letter-header');
      const letterGreeting = document.getElementById('letter-greeting');
      const letterBody = document.getElementById('letter-body');
      const letterSignature = document.getElementById('letter-signature');
      const replayArea = document.getElementById('replay-area');
      const replayTrigger = document.getElementById('replay-trigger');

      let isOpening = false;
      let typingSessionId = 0;
      let userScrolledManually = false;
      let timers = [];

      function scheduleTimeout(fn, delay) {
        const id = setTimeout(fn, delay);
        timers.push(id);
        return id;
      }

      function clearAllTimers() {
        while (timers.length) {
          clearTimeout(timers.pop());
        }
      }

      /* Phát hiện khi người dùng tự cuộn trên điện thoại để không ép cuộn tự động */
      letterStage.addEventListener('touchmove', function () {
        userScrolledManually = true;
      }, { passive: true });

      letterStage.addEventListener('wheel', function () {
        userScrolledManually = true;
      }, { passive: true });

      /* ==================== PHÁT NHẠC TỪ THƯ MỤC style/ ==================== */
      const GentlePiano = (function () {
        let fadeInterval = null;

        return {
          start: function () {
            const audio = document.getElementById('bg-audio');
            if (!audio) return;

            // Nếu nhạc đã đang phát thì giữ nguyên không phát đè
            if (!audio.paused) return;

            // Khởi đầu với âm lượng nhỏ và tăng dần lên mức ấm áp (0.6) để không gây giật mình
            audio.volume = 0.05;
            const playPromise = audio.play();

            if (playPromise !== undefined) {
              playPromise
                .then(function () {
                  if (fadeInterval) clearInterval(fadeInterval);
                  fadeInterval = setInterval(function () {
                    if (audio.volume < 0.56) {
                      audio.volume = Math.min(0.6, audio.volume + 0.04);
                    } else {
                      audio.volume = 0.6;
                      clearInterval(fadeInterval);
                    }
                  }, 180);
                })
                .catch(function () {
                  // Nếu chưa có file nhạc trong style/ hoặc trình duyệt chặn, website vẫn hoạt động hoàn chỉnh
                });
            }
          }
        };
      })();

      /* ==================== HỆ THỐNG HẠT SÁNG & CÁNH HOA (CANVAS) ==================== */
      const canvas = document.getElementById('effect-canvas');
      const ctx2d = canvas.getContext('2d');
      let cw = window.innerWidth;
      let ch = window.innerHeight;
      let warmModeActive = false;

      const bokehOrbs = [];
      const burstParticles = [];
      const fallingPetals = [];

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cw = window.innerWidth;
        ch = window.innerHeight;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });
      resizeCanvas();

      // Khởi tạo các đốm sáng chuyển động tinh tế
      function initBokeh() {
        const count = cw < 600 ? 22 : 36;
        bokehOrbs.length = 0;
        for (let i = 0; i < count; i++) {
          bokehOrbs.push({
            x: Math.random() * cw,
            y: Math.random() * ch,
            r: 2 + Math.random() * 6,
            vx: (Math.random() - 0.5) * 0.22,
            vy: -0.15 - Math.random() * 0.28,
            alpha: 0.18 + Math.random() * 0.45,
            phase: Math.random() * Math.PI * 2,
            gold: Math.random() > 0.35
          });
        }
      }

      // Khởi tạo cánh hoa bay chậm khi mở thư
      function createPetal(randomY) {
        const colors = [
          'rgba(244, 172, 183, 0.78)',
          'rgba(250, 198, 205, 0.82)',
          'rgba(235, 145, 160, 0.72)',
          'rgba(253, 224, 215, 0.85)'
        ];
        return {
          x: Math.random() * cw,
          y: randomY ? Math.random() * ch : -25 - Math.random() * 60,
          size: 6 + Math.random() * 6.5,
          vy: 0.42 + Math.random() * 0.55,
          vx: (Math.random() - 0.4) * 0.45,
          swayAmp: 0.4 + Math.random() * 0.8,
          swaySpeed: 0.012 + Math.random() * 0.018,
          swayPhase: Math.random() * Math.PI * 2,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.02,
          color: colors[Math.floor(Math.random() * colors.length)]
        };
      }

      function initFallingPetals() {
        const count = cw < 600 ? 15 : 24;
        fallingPetals.length = 0;
        for (let i = 0; i < count; i++) {
          fallingPetals.push(createPetal(true));
        }
      }

      // Hiệu ứng trái tim bung nở thành những cánh nhỏ & hạt sáng lấp lánh
      function triggerHeartBurst(originX, originY) {
        const total = cw < 600 ? 68 : 95;
        for (let i = 0; i < total; i++) {
          const angle = (Math.PI * 2 * i) / total + (Math.random() - 0.5) * 0.35;
          const speed = 1.6 + Math.random() * 5.8;
          const isPetal = i % 2 === 0;
          burstParticles.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.6,
            gravity: isPetal ? 0.028 : 0.012,
            drag: 0.972,
            size: isPetal ? (5.5 + Math.random() * 5) : (2 + Math.random() * 3),
            alpha: 1,
            decay: 0.0085 + Math.random() * 0.007,
            rotation: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.08,
            isPetal: isPetal,
            color: isPetal
              ? (Math.random() > 0.4 ? '#eb7a8b' : '#f7b2bc')
              : (Math.random() > 0.3 ? '#fff0c2' : '#f5c77e')
          });
        }
      }

      function drawPetalShape(ctx, x, y, size, rotation, fillStyle, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = fillStyle;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.bezierCurveTo(size * 0.85, -size * 0.75, size * 0.75, size * 0.65, 0, size);
        ctx.bezierCurveTo(-size * 0.75, size * 0.65, -size * 0.85, -size * 0.75, 0, -size);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function renderCanvasLoop() {
        ctx2d.clearRect(0, 0, cw, ch);

        // 1. Vẽ đốm sáng bokeh chuyển động tinh tế
        for (let i = 0; i < bokehOrbs.length; i++) {
          const b = bokehOrbs[i];
          b.x += b.vx;
          b.y += b.vy;
          b.phase += 0.02;

          if (b.y < -20) b.y = ch + 20;
          if (b.x < -20) b.x = cw + 20;
          if (b.x > cw + 20) b.x = -20;

          const currentAlpha = b.alpha * (0.65 + 0.35 * Math.sin(b.phase));
          const grad = ctx2d.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.2);
          if (b.gold || warmModeActive) {
            grad.addColorStop(0, 'rgba(255, 244, 208, ' + currentAlpha + ')');
            grad.addColorStop(1, 'rgba(255, 230, 175, 0)');
          } else {
            grad.addColorStop(0, 'rgba(255, 220, 228, ' + currentAlpha + ')');
            grad.addColorStop(1, 'rgba(255, 205, 215, 0)');
          }

          ctx2d.fillStyle = grad;
          ctx2d.beginPath();
          ctx2d.arc(b.x, b.y, b.r * 2.2, 0, Math.PI * 2);
          ctx2d.fill();
        }

        // 2. Vẽ hiệu ứng bung nở từ trái tim
        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const p = burstParticles[i];
          p.vx *= p.drag;
          p.vy = p.vy * p.drag + p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.spin;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            burstParticles.splice(i, 1);
            continue;
          }

          if (p.isPetal) {
            drawPetalShape(ctx2d, p.x, p.y, p.size, p.rotation, p.color, p.alpha);
          } else {
            ctx2d.save();
            ctx2d.globalAlpha = Math.max(0, p.alpha);
            ctx2d.fillStyle = p.color;
            ctx2d.shadowColor = '#ffe7a8';
            ctx2d.shadowBlur = 8;
            ctx2d.beginPath();
            ctx2d.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx2d.fill();
            ctx2d.restore();
          }
        }

        // 3. Vẽ các cánh hoa bay chậm khi thư mở
        if (warmModeActive) {
          for (let i = 0; i < fallingPetals.length; i++) {
            const fp = fallingPetals[i];
            fp.swayPhase += fp.swaySpeed;
            fp.x += fp.vx + Math.sin(fp.swayPhase) * fp.swayAmp;
            fp.y += fp.vy;
            fp.angle += fp.spin;

            if (fp.y > ch + 30) {
              fallingPetals[i] = createPetal(false);
            }
            if (fp.x > cw + 30) fp.x = -20;
            if (fp.x < -30) fp.x = cw + 20;

            drawPetalShape(ctx2d, fp.x, fp.y, fp.size, fp.angle, fp.color, 0.78);
          }
        }

        requestAnimationFrame(renderCanvasLoop);
      }

      initBokeh();
      initFallingPetals();
      requestAnimationFrame(renderCanvasLoop);

      /* ==================== XÂY DỰNG NỘI DUNG & HIỆU ỨNG ĐÁNH MÁY ==================== */
      let greetingChars = [];
      let paragraphStructures = [];

      function buildLetterDOM() {
        letterGreeting.innerHTML = '';
        letterBody.innerHTML = '';
        greetingChars = [];
        paragraphStructures = [];

        // Xây dựng dòng chào đầu thư
        const greetWords = GREETING_TEXT.split(' ');
        greetWords.forEach(function (word, wIdx) {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word-unit';
          Array.from(word).forEach(function (ch) {
            const charSpan = document.createElement('span');
            charSpan.className = 'char-unit';
            charSpan.textContent = ch;
            wordSpan.appendChild(charSpan);
            greetingChars.push(charSpan);
          });
          letterGreeting.appendChild(wordSpan);
          if (wIdx < greetWords.length - 1) {
            const spaceSpan = document.createElement('span');
            spaceSpan.className = 'char-unit';
            spaceSpan.textContent = ' ';
            letterGreeting.appendChild(spaceSpan);
            greetingChars.push(spaceSpan);
          }
        });

        // Xây dựng từng đoạn văn
        PARAGRAPHS_DATA.forEach(function (item) {
          const p = document.createElement('p');
          p.className = 'letter-paragraph' + (item.className ? ' ' + item.className : '');
          const charsInPara = [];

          const words = item.text.split(' ');
          words.forEach(function (word, wIdx) {
            const wordSpan = document.createElement('span');
            wordSpan.className = 'word-unit';
            Array.from(word).forEach(function (ch) {
              const charSpan = document.createElement('span');
              charSpan.className = 'char-unit';
              charSpan.textContent = ch;
              wordSpan.appendChild(charSpan);
              charsInPara.push({ el: charSpan, ch: ch });
            });
            p.appendChild(wordSpan);

            if (wIdx < words.length - 1) {
              const spaceSpan = document.createElement('span');
              spaceSpan.className = 'char-unit';
              spaceSpan.textContent = ' ';
              p.appendChild(spaceSpan);
              charsInPara.push({ el: spaceSpan, ch: ' ' });
            }
          });

          letterBody.appendChild(p);
          paragraphStructures.push({
            element: p,
            chars: charsInPara
          });
        });
      }

      function startTypewriterSequence(session) {
        let gIdx = 0;

        function typeGreeting() {
          if (session !== typingSessionId) return;
          if (gIdx < greetingChars.length) {
            greetingChars[gIdx].classList.add('revealed');
            gIdx++;
            scheduleTimeout(typeGreeting, 32);
          } else {
            scheduleTimeout(function () {
              typeParagraph(0);
            }, 320);
          }
        }

        function typeParagraph(pIdx) {
          if (session !== typingSessionId) return;
          if (pIdx >= paragraphStructures.length) {
            // Hoàn tất các đoạn văn -> Hiện chữ ký viết tay & nút xem lại tinh tế
            letterSignature.classList.add('show');
            if (!userScrolledManually) {
              letterSignature.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            scheduleTimeout(function () {
              if (session !== typingSessionId) return;
              replayArea.classList.add('show');
            }, 1900);
            return;
          }

          const paraObj = paragraphStructures[pIdx];
          paraObj.element.classList.add('active-para');

          let cIdx = 0;
          const chars = paraObj.chars;

          function typeNextChar() {
            if (session !== typingSessionId) return;
            if (cIdx < chars.length) {
              // Hiển thị 2 ký tự mỗi nhịp để tốc độ mượt, tự nhiên và không làm mẹ phải chờ lâu
              const item1 = chars[cIdx];
              item1.el.classList.add('revealed');
              cIdx++;

              let delay = 22;
              const ch = item1.ch;

              if (ch === ',' || ch === ';') {
                delay = 115;
              } else if (ch === '.' || ch === '!' || ch === '…') {
                delay = 210;
              } else if (cIdx < chars.length && chars[cIdx].ch !== '.' && chars[cIdx].ch !== ',') {
                chars[cIdx].el.classList.add('revealed');
                cIdx++;
              }

              // Tự động cuộn nhẹ nhàng nếu mẹ chưa tự chạm cuộn màn hình
              if (!userScrolledManually && cIdx % 45 === 0) {
                const rect = paraObj.element.getBoundingClientRect();
                if (rect.bottom > window.innerHeight - 50) {
                  letterStage.scrollBy({ top: 65, behavior: 'smooth' });
                }
              }

              scheduleTimeout(typeNextChar, delay);
            } else {
              scheduleTimeout(function () {
                typeParagraph(pIdx + 1);
              }, 280);
            }
          }

          typeNextChar();
        }

        typeGreeting();
      }

      /* ==================== CHUỖI HIỆU ỨNG MỞ QUÀ ==================== */
      function startGiftSequence() {
        if (isOpening) return;
        isOpening = true;
        userScrolledManually = false;
        typingSessionId++;
        const currentSession = typingSessionId;

        // Phát file nhạc trong thư mục style/ ngay sau thao tác chạm của người dùng
        GentlePiano.start();

        // Chuẩn bị DOM lá thư
        buildLetterDOM();
        letterHeader.classList.remove('show');
        letterSignature.classList.remove('show');
        replayArea.classList.remove('show');
        letterStage.scrollTop = 0;

        // Bước 1: Trái tim phát sáng nhẹ và rung lên đầy cảm xúc
        heartTrigger.classList.add('activating');
        introStage.classList.add('fading-text');

        // Bước 2: Trái tim bung nở thành những cánh hoa nhỏ & hạt sáng lấp lánh
        scheduleTimeout(function () {
          const rect = heartTrigger.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          triggerHeartBurst(centerX, centerY);

          // Chuyển nền sang khung cảnh ấm áp có ánh nắng nhẹ & cánh hoa bay
          document.body.classList.add('warm-scene');
          warmModeActive = true;
        }, 780);

        // Bước 3: Ẩn màn hình trái tim, phong thư sang trọng từ từ xuất hiện ở trung tâm
        scheduleTimeout(function () {
          introStage.classList.add('hidden');
          envelopeStage.classList.add('active');
        }, 950);

        // Bước 4: Phong bì tự động mở nắp
        scheduleTimeout(function () {
          envelope3D.classList.add('open-flap');
        }, 1750);

        // Bước 5: Lá thư bên trong từ từ trượt lên
        scheduleTimeout(function () {
          envelope3D.classList.add('slide-letter');
        }, 2400);

        // Bước 6: Phong bì lùi nhẹ và tờ giấy mở ra với hiệu ứng 3D tự nhiên
        scheduleTimeout(function () {
          envelopeStage.classList.add('fade-away');
          letterStage.classList.add('visible');

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              letterStage.classList.add('unfolded');
            });
          });
        }, 3350);

        // Bước 7: Hiển thị tiêu đề và bắt đầu hiệu ứng đánh máy từng dòng
        scheduleTimeout(function () {
          letterHeader.classList.add('show');
        }, 4050);

        scheduleTimeout(function () {
          startTypewriterSequence(currentSession);
        }, 4550);
      }

      /* ==================== MỞ LẠI TỪ ĐẦU TINH TẾ ==================== */
      function resetToBeginning() {
        clearAllTimers();
        typingSessionId++;
        userScrolledManually = false;

        letterStage.classList.remove('unfolded');
        letterStage.classList.remove('visible');

        envelopeStage.classList.remove('active', 'fade-away');
        envelope3D.classList.remove('open-flap', 'slide-letter');

        document.body.classList.remove('warm-scene');
        warmModeActive = false;

        heartTrigger.classList.remove('activating');
        introStage.classList.remove('fading-text', 'hidden');

        scheduleTimeout(function () {
          letterHeader.classList.remove('show');
          letterSignature.classList.remove('show');
          replayArea.classList.remove('show');
          letterGreeting.innerHTML = '';
          letterBody.innerHTML = '';
          isOpening = false;
        }, 650);
      }

      /* ==================== SỰ KIỆN CẢM ỨNG & CHUỘT ==================== */
      heartTrigger.addEventListener('click', function (e) {
        e.preventDefault();
        startGiftSequence();
      });

      heartTrigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          startGiftSequence();
        }
      });

      replayTrigger.addEventListener('click', function (e) {
        e.preventDefault();
        resetToBeginning();
      });

      replayTrigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          resetToBeginning();
        }
      });
    })();
  </script>
